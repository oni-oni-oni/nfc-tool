<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>道具管理システム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-bottom: 80px; }
        .card-custom { border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); padding: 20px; margin-top: 15px; }
        .nav-fixed { position: fixed; bottom: 0; width: 100%; background: white; border-top: 1px solid #ddd; display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; }
        .nav-fixed a { text-decoration: none; color: #666; display: flex; flex-direction: column; align-items: center; font-size: 10px; flex: 1; transition: 0.2s; }
        /* アクティブなタブの色 */
        .nav-fixed a.active { color: #0d6efd; font-weight: bold; }
        .nav-icon { font-size: 24px; margin-bottom: 2px; }
        
        .view-section { display: none; }
        .active-view { display: block; }
        img.thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; background: #eee; }
    </style>
</head>
<body>

<div class="container" id="app">
    <div id="view-login" class="view-section active-view mt-5 text-center">
        <div class="card card-custom border-0">
            <h3 class="fw-bold mb-4">🔑 Login</h3>
            <input type="text" id="userId" class="form-control mb-3" placeholder="ユーザーID">
            <input type="password" id="userPw" class="form-control mb-4" placeholder="パスワード">
            <button class="btn btn-primary w-100 py-3" onclick="handleLogin()">ログイン</button>
            <p id="loginMsg" class="text-danger mt-3 small"></p>
        </div>
    </div>

    <div id="view-scan" class="view-section mt-3">
        <div class="card card-custom border-0 text-center">
            <h5 class="fw-bold mb-3">📡 タグスキャン</h5>
            <div class="py-5 bg-light rounded border mb-3" style="border-style: dashed !important;">
                <p class="mb-0 text-muted">スキャン待機中...</p>
                <div id="scanFeedback" class="fw-bold text-primary mt-2"></div>
            </div>
            <button class="btn btn-outline-primary py-3 w-100" onclick="scanSingleTag()">
                スキャンを開始する
            </button>
        </div>
    </div>

    <div id="view-list" class="view-section mt-3">
        <div class="card card-custom border-0">
            <h5 class="fw-bold mb-3">📋 貸出・返却履歴</h5>
            <div class="table-responsive">
                <table class="table table-sm small">
                    <thead><tr><th>日時</th><th>道具</th><th>状態</th><th>氏名</th></tr></thead>
                    <tbody id="historyTbd">
                        <tr><td colspan="4" class="text-center py-4 text-muted">履歴はありません</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="view-register" class="view-section mt-3">
        <div class="card card-custom border-0 mb-4">
            <h5 class="fw-bold">➕ 道具の登録・編集</h5>
            <div class="row g-2">
                <div class="col-8"><input type="text" id="regName" class="form-control" placeholder="道具名"></div>
                <div class="col-4"><button class="btn btn-secondary w-100" onclick="scanSingleTag('regTag')">スキャン</button></div>
            </div>
            <input type="text" id="regTag" class="form-control my-2 bg-light" readonly placeholder="タグID">
            <input type="text" id="regRemarks" class="form-control mb-2" placeholder="備考・メモ">
            <input type="file" id="regImage" class="form-control mb-2" accept="image/*" capture="environment">
            <button class="btn btn-success w-100" id="btnReg" onclick="registerTool()">名簿に保存</button>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle bg-white rounded shadow-sm small">
                <thead class="table-light"><tr><th>写真</th><th>道具名</th><th>操作</th></tr></thead>
                <tbody id="toolMasterTbd"></tbody>
            </table>
        </div>
    </div>
</div>

<nav class="nav-fixed" id="mainNav" style="display: none;">
    <a href="#" id="nav-scan" onclick="switchView('scan'); return false;">
        <span class="nav-icon">📡</span><span>スキャン</span>
    </a>
    <a href="#" id="nav-list" onclick="switchView('list'); return false;">
        <span class="nav-icon">📋</span><span>履歴</span>
    </a>
    <a href="#" id="nav-register" onclick="switchView('register'); return false;">
        <span class="nav-icon">➕</span><span>登録</span>
    </a>
    <a href="#" onclick="location.reload();">
        <span class="nav-icon">🚪</span><span>終了</span>
    </a>
</nav>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbz_aAZvAV3kRKlCrhtczqHj4CbdtKUDykMqN5RxZfk2-CHQ392VYcl7yD9wvtlgykL7YA/exec";
    let session = { sId: "", folderId: "" };

    async function callGas(p) { return await fetch(GAS_URL, { method: "POST", body: JSON.stringify(p) }); }

    function switchView(v) {
        // 画面切り替え
        document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active-view'));
        const target = document.getElementById('view-' + v);
        if (target) target.classList.add('active-view');

        // ナビゲーションの「アクティブ色」を更新
        document.querySelectorAll('.nav-fixed a').forEach(a => a.classList.remove('active'));
        const activeNav = document.getElementById('nav-' + v);
        if (activeNav) activeNav.classList.add('active');

        if (v === 'register') loadToolMaster();
        if (v === 'list') loadHistory();
    }

    async function handleLogin() {
        const id = document.getElementById('userId').value, pw = document.getElementById('userPw').value;
        const res = await callGas({ action: "login", id, pw });
        const data = await res.json();
        if (data.success) {
            session = data;
            document.getElementById('mainNav').style.display = "flex";
            switchView('register');
        } else { alert("認証失敗"); }
    }

    async function loadToolMaster() {
        const tbd = document.getElementById('toolMasterTbd');
        tbd.innerHTML = '<tr><td colspan="3" class="text-center">読み込み中...</td></tr>';
        const res = await callGas({ action: "fetchToolMaster", sId: session.sId });
        const tools = await res.json();
        tbd.innerHTML = tools.map(t => `
            <tr>
                <td><img src="${(t[3] && t[3].startsWith('http')) ? t[3] : ''}" class="thumb"></td>
                <td><b>${t[0]}</b><br><small class="text-muted">${t[1]}</small></td>
                <td>
                    <button class="btn btn-sm btn-outline-primary" onclick="editTool('${t[1]}','${t[0]}','${t[4]}')">編集</button>
                </td>
            </tr>
        `).join('');
    }

    async function loadHistory() {
        // 履歴読み込み処理
    }

    function editTool(tag, name, rem) {
        document.getElementById('regTag').value = tag;
        document.getElementById('regName').value = name;
        document.getElementById('regRemarks').value = rem || "";
        document.getElementById('btnReg').innerText = "上書き保存";
        document.getElementById('btnReg').className = "btn btn-warning w-100";
        window.scrollTo(0,0);
    }

    async function scanSingleTag(targetId = null) {
        try {
            const ndef = new NDEFReader(); 
            await ndef.scan();
            ndef.onreading = e => {
                const tagId = e.serialNumber;
                if (targetId) {
                    document.getElementById(targetId).value = tagId;
                } else {
                    document.getElementById('scanFeedback').innerText = "検出: " + tagId;
                }
            };
        } catch (e) { alert("NFCスキャンに失敗しました"); }
    }

    async function registerTool() {
        const btn = document.getElementById('btnReg');
        btn.disabled = true; btn.innerText = "保存中...";
        const imgFile = document.getElementById('regImage').files[0];
        let base64 = "";
        if (imgFile) {
            base64 = await new Promise(r => { const rd = new FileReader(); rd.onload = e => r(e.target.result); rd.readAsDataURL(imgFile); });
        }
        try {
            const res = await callGas({
                action: "addToolMaster", sId: session.sId, folderId: session.folderId,
                name: document.getElementById('regName').value, tag: document.getElementById('regTag').value,
                remarks: document.getElementById('regRemarks').value, imageBlob: base64
            });
            const msg = await res.text();
            alert(msg);
            if(msg.includes("完了")) {
                document.getElementById('regName').value = ""; document.getElementById('regTag').value = "";
                document.getElementById('btnReg').innerText = "名簿に保存"; document.getElementById('btnReg').className = "btn btn-success w-100";
                loadToolMaster();
            }
        } catch (e) { alert("エラーが発生しました"); }
        btn.disabled = false;
    }
</script>

</body>
</html>
