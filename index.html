<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>道具管理システム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-bottom: 80px; }
        .card-custom { border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); padding: 20px; margin-top: 15px; }
        .nav-fixed { position: fixed; bottom: 0; width: 100%; background: white; border-top: 1px solid #ddd; display: flex; justify-content: space-around; padding: 12px 0; z-index: 1000; }
        .view-section { display: none; }
        .active-view { display: block; }
        img.thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; background: #eee; }
        .nav-fixed a { text-decoration: none; color: #666; display: flex; flex-direction: column; align-items: center; font-size: 10px; }
        .nav-icon { font-size: 24px; margin-bottom: 4px; display: block; }
    </style>
</head>
<body>

<div class="container" id="app">
    <div id="view-login" class="view-section active-view mt-5 text-center">
        <div class="card card-custom border-0 shadow-sm">
            <h3 class="fw-bold mb-4">🔑 Login</h3>
            <input type="text" id="userId" class="form-control mb-3" placeholder="ユーザーID">
            <input type="password" id="userPw" class="form-control mb-4" placeholder="パスワード">
            <button class="btn btn-primary w-100 py-3 fw-bold" onclick="handleLogin()">ログイン</button>
        </div>
    </div>

    <div id="view-scan" class="view-section">
        <div class="card card-custom border-0 text-center">
            <h5 class="fw-bold mb-3">📡 貸出・返却スキャン</h5>
            <select id="staffSelect" class="form-select mb-3"><option value="">担当者を選択</option></select>
            <div class="d-flex gap-2 mb-3">
                <button id="btnLend" class="btn btn-primary w-50 py-3 fw-bold" onclick="setStatus('貸出')">貸出</button>
                <button id="btnReturn" class="btn btn-outline-secondary w-50 py-3 fw-bold" onclick="setStatus('返却')">返却</button>
            </div>
            <button class="btn btn-dark w-100 py-4 fw-bold" onclick="startNfcScan()">📱 タグをスキャン</button>
        </div>
        <div id="scanLog" class="small text-muted p-2 text-center"></div>
    </div>

    <div id="view-list" class="view-section">
        <div class="card card-custom border-0">
            <h5 class="fw-bold mb-3">📋 最近の履歴</h5>
            <div class="table-responsive">
                <table class="table table-sm small">
                    <thead class="table-light"><tr><th>日時</th><th>道具</th><th>状態</th><th>氏名</th></tr></thead>
                    <tbody id="historyTbd"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="view-register" class="view-section">
        <div class="card card-custom border-0 mb-4">
            <h5 class="fw-bold">➕ 道具の登録・編集</h5>
            <div class="row g-2">
                <div class="col-8"><input type="text" id="regName" class="form-control" placeholder="道具名"></div>
                <div class="col-4"><button class="btn btn-secondary w-100" onclick="scanForRegister()">スキャン</button></div>
            </div>
            <input type="text" id="regTag" class="form-control my-2 bg-light" readonly placeholder="タグID">
            <input type="text" id="regRemarks" class="form-control mb-2" placeholder="備考">
            <input type="file" id="regImage" class="form-control mb-2" accept="image/*" capture="environment">
            <button class="btn btn-success w-100" id="btnReg" onclick="registerTool()">名簿に保存</button>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle bg-white rounded shadow-sm">
                <tbody id="toolMasterTbd"></tbody>
            </table>
        </div>
    </div>
</div>

<nav class="nav-fixed" id="mainNav" style="display: none;">
    <a href="#" onclick="switchView('scan', this); return false;"><span class="nav-icon">📡</span><span>スキャン</span></a>
    <a href="#" onclick="switchView('list', this); return false;"><span class="nav-icon">📋</span><span>履歴一覧</span></a>
    <a href="#" onclick="switchView('register', this); return false;"><span class="nav-icon">➕</span><span>道具登録</span></a>
    <a href="#" onclick="location.reload();"><span class="nav-icon">🚪</span><span>ログアウト</span></a>
</nav>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbz_aAZvAV3kRKlCrhtczqHj4CbdtKUDykMqN5RxZfk2-CHQ392VYcl7yD9wvtlgykL7YA/exec";
    let session = { sId: "" }, currentStatus = "貸出";

    async function callGas(p) {
        const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify(p) });
        return await res.json();
    }

    function switchView(v, el) {
        document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active-view'));
        document.getElementById('view-' + v).classList.add('active-view');
        document.querySelectorAll('.nav-fixed a').forEach(a => a.style.color = '#666');
        if(el) el.style.color = '#0d6efd';
        if (v === 'register') loadToolMaster();
        if (v === 'list') loadHistory();
        if (v === 'scan') loadStaff();
    }

    async function handleLogin() {
        const id = document.getElementById('userId').value, pw = document.getElementById('userPw').value;
        const data = await callGas({ action: "login", id, pw });
        if (data.success) {
            session = data;
            document.getElementById('mainNav').style.display = "flex";
            switchView('scan', document.querySelector('nav a'));
        } else { alert("認証失敗"); }
    }

    async function loadStaff() {
        const staff = await callGas({ action: "fetchStaff", sId: session.sId });
        document.getElementById('staffSelect').innerHTML = '<option value="">担当者を選択</option>' + 
            staff.map(s => `<option value="${s[0]}">${s[0]}</option>`).join('');
    }

    async function startNfcScan() {
        const userName = document.getElementById('staffSelect').value;
        if (!userName) return alert("担当者を選択してください");
        try {
            const ndef = new NDEFReader(); await ndef.scan();
            ndef.onreading = async e => {
                const tagId = e.serialNumber;
                const res = await callGas({ action: "update", sId: session.sId, status: currentStatus, userName, tagIds: [tagId] });
                alert(res.message);
                loadHistory();
            };
        } catch(e) { alert("NFCエラー"); }
    }

    async function loadHistory() {
        const history = await callGas({ action: "fetchHistory", sId: session.sId });
        document.getElementById('historyTbd').innerHTML = history.slice(0,20).map(h => `
            <tr><td>${new Date(h[6]).toLocaleString()}</td><td>${h[1]}</td><td>${h[4]}</td><td>${h[3]}</td></tr>
        `).join('');
    }

    async function loadToolMaster() {
        const tools = await callGas({ action: "fetchToolMaster", sId: session.sId });
        document.getElementById('toolMasterTbd').innerHTML = tools.map(t => `
            <tr><td><img src="${t[3]||''}" class="thumb"></td><td><b>${t[0]}</b></td></tr>
        `).join('');
    }

    function setStatus(s) {
        currentStatus = s;
        document.getElementById('btnLend').className = s === '貸出' ? 'btn btn-primary w-50 py-3 fw-bold' : 'btn btn-outline-secondary w-50 py-3 fw-bold';
        document.getElementById('btnReturn').className = s === '返却' ? 'btn btn-primary w-50 py-3 fw-bold' : 'btn btn-outline-secondary w-50 py-3 fw-bold';
    }

    async function scanForRegister() {
        const ndef = new NDEFReader(); await ndef.scan();
        ndef.onreading = e => { document.getElementById('regTag').value = e.serialNumber; };
    }

    async function registerTool() { /* 登録処理 */ }
</script>
</body>
</html>
